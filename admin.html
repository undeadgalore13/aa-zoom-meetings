<!DOCTYPE html>

.copy { background: #2962ff; }

// ---------- BUILD ----------
const container = document.getElementById("container");

for (let section in data) {
    let div = document.createElement("div");
    div.className = "section";

    let title = document.createElement("h2");
    title.innerText = titles[section];
    div.appendChild(title);

    let desc = document.createElement("p");
    desc.innerText = "Select all that apply";
    div.appendChild(desc);

    data[section].forEach(item => {
        let label = document.createElement("label");
        label.innerHTML = `<input type="checkbox" value="${item}"> ${item}`;
        div.appendChild(label);
    });

    container.appendChild(div);
}

// ---------- GENERATE ----------
function generate() {
    let output = "";

    for (let section in data) {
        let values = [];
        document.querySelectorAll("input:checked").forEach(c => {
            if (c.closest(".section").querySelector("h2").innerText === titles[section]) {
                values.push(c.value);
            }
        });

        output += titles[section] + ":\n";
        values.forEach(v => output += "- " + v + "\n");
        output += "\n";
    }

    document.getElementById("output").value = output;
}

// ---------- COPY ----------
function copyText() {
    let text = document.getElementById("output");
    text.select();
    document.execCommand("copy");
    alert("Copied!");
}

</script>

</body>
