<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preference Test</title>

<style>
body {
    font-family: -apple-system, sans-serif;
    background: #0f0f0f;
    color: white;
    padding: 15px;
}
h1 { text-align: center; }
h2 { margin-top: 25px; }
p { font-size: 14px; color: #aaa; }

.section { margin-bottom: 25px; }

.search {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
}

label {
    display: block;
    padding: 8px;
    border-bottom: 1px solid #222;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
}

.generate { background: #00c853; color: white; }
.copy { background: #2962ff; color: white; }

textarea {
    width: 100%;
    height: 220px;
    margin-top: 10px;
    background: #111;
    color: white;
    border-radius: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<h1>Food & Lifestyle Preferences</h1>

<div id="container"></div>

<button class="generate" onclick="generate()">Generate My Answers</button>
<textarea id="output" placeholder="Your answers will appear here..."></textarea>
<button class="copy" onclick="copyText()">Copy Answers</button>

<script>

// ---------- FULL TITLES ----------
const titles = {
Q1: "1. Fast Food & Quick Eats You Like",
Q2: "2. Restaurant Types / Styles You Like",
Q3: "3. Dislikes (Food, Places, Ingredients, Rules)",
Q4: "4. Drinks You Like",
Q5: "5. Scents You Like",
Q6: "6. Flavor Preferences"
};

// ---------- DATA ----------
const data = {

Q1: ["McDonald’s","Burger King","Wendy’s","Taco Bell","Chick-fil-A","Subway","KFC","Arby’s","Sonic","Domino’s","Pizza Hut","Little Caesars","Popeyes","Panda Express","Dairy Queen","Hardee’s","Five Guys","Jersey Mike’s","Jimmy John’s","Wingstop","Culver’s","Raising Cane’s","Whataburger","Fazoli’s","Krispy Kreme","Krystal","Freddy’s","Zaxby’s","Bojangles","Cook Out","Firehouse Subs","Tropical Smoothie Cafe","Smoothie King","Blaze Pizza","MOD Pizza","Marco’s Pizza","Papa John’s","Petro’s","Buddy’s BBQ","Pal’s","Gus’s Chicken","Pollo Ala Brasa","Smash Shack","Golden Roast","Hunt Brothers","Weigel’s","Casey’s","Speedway","Victor’s Taco Shop","Chapulines"],

Q2: ["Steakhouse","American","Diner","BBQ","Mexican","Italian","Chinese","Japanese","Sushi","Thai","Indian","Mediterranean","Greek","French","Pizza","Burgers","Seafood","Vegan","Buffet","Fine Dining","Brunch","Cafe"],

Q3: ["No seafood","No pork","No beef","No dairy","No spicy","No fried","No raw food","Mushrooms","Onions","Tomatoes","Pickles","Cheese","Eggs","Crunchy","Soft","Crowded places","Long waits","Buffets","Spicy","Sweet","Salty","Bitter","Sour","Smoky","Creamy"],

Q4: ["Coke","Diet Coke","Coke Zero","Pepsi","Dr Pepper","Sprite","Sweet Tea","Unsweet Tea","Lemonade","Water","Gatorade","Coffee","Latte","Milkshake","Smoothie","Energy Drinks"],

Q5: ["Vanilla","Lavender","Rose","Coconut","Fresh Linen","Ocean","Citrus","Sandalwood","Mint","Coffee","Campfire"],

Q6: ["Sweet","Salty","Spicy","Mild","Hot","Sour","Tangy","Savory","Smoky","Creamy","Fresh","Crunchy","Juicy"]

};

// ---------- BUILD ----------
const container = document.getElementById("container");

for (let section in data) {
    let div = document.createElement("div");
    div.className = "section";

    let title = document.createElement("h2");
    title.innerText = titles[section];
    div.appendChild(title);

    let desc = document.createElement("p");
    desc.innerText = "Select all that apply";
    div.appendChild(desc);

    let search = document.createElement("input");
    search.className = "search";
    search.placeholder = "Search...";
    search.oninput = function () {
        let labels = div.querySelectorAll("label");
        labels.forEach(l => {
            l.style.display = l.innerText.toLowerCase().includes(search.value.toLowerCase()) ? "block" : "none";
        });
    };
    div.appendChild(search);

    data[section].forEach(item => {
        let label = document.createElement("label");
        label.innerHTML = `<input type="checkbox" value="${item}"> ${item}`;
        div.appendChild(label);
    });

    container.appendChild(div);
}

// ---------- GENERATE ----------
function generate() {
    let output = "";

    for (let section in data) {
        let checked = document.querySelectorAll(`#container input[type=checkbox]:checked`);
        let values = [];

        checked.forEach(c => {
            let parent = c.closest(".section").querySelector("h2").innerText;
            if (parent === titles[section]) {
                values.push(c.value);
            }
        });

        output += titles[section] + ":\n";
        values.forEach(v => output += "- " + v + "\n");
        output += "\n";
    }

    document.getElementById("output").value = output;
}

// ---------- COPY ----------
function copyText() {
    let text = document.getElementById("output");
    text.select();
    document.execCommand("copy");
    alert("Copied!");
}

</script>

</body>
</html>
